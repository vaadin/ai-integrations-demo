name: build

on:
  push:
    branches: ['v25']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      # one platform failing should not cancel the other, the point is to see both results
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and check the formatting
        run: mvn -B verify

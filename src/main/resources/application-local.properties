# A local model through an OpenAI-compatible server, for example Ollama after `ollama pull qwen2.5:14b` (the model
# has to support tool calling). Start with SPRING_PROFILES_ACTIVE=local.
spring.ai.openai.base-url=${AI_BASE_URL:http://localhost:11434/v1}
spring.ai.openai.api-key=${OPENAI_API_KEY:ollama}
spring.ai.openai.chat.model=${AI_MODEL:qwen2.5:14b}

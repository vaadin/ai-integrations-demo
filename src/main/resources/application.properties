server.port=${PORT:8080}
vaadin.launch-browser=false
# Vaadin scans for routes and components only in the application's own package; its own packages are always scanned
vaadin.allowed-packages=com.vaadin.demo.nordicsupply
logging.level.org.atmosphere=warn

# JPA reads the tables the dataset created; Hibernate never creates or alters them (the default for an embedded
# database would be create-drop, which would wipe the loaded data)
spring.jpa.hibernate.ddl-auto=none
# No session per request: a view reads a projection or a service result, never a lazy association
spring.jpa.open-in-view=false

# The model, reached through Spring AI's OpenAI starter. The key comes from the environment; the placeholder keeps the
# application starting without one, and every model turn then fails with a visible error instead of the start-up.
spring.ai.openai.api-key=${OPENAI_API_KEY:missing-key}
spring.ai.openai.chat.model=${AI_MODEL:gpt-5.6-luna}
spring.ai.openai.chat.temperature=0.2
# GPT-5.6 models reason by default, and the chat-completions endpoint allows function tools only with reasoning off
spring.ai.openai.chat.reasoning-effort=none

# What one model call may cost, whoever asks. The longest reply, where a chart's configuration or a table's query is
# the bulk; the tool calls a turn may make, since every call sends the schema and the memory again (a claim takes
# about eight, a chart about five, and a model retrying a tool it got wrong takes more); how many times the OpenAI
# client retries a failed call (its own setting: Spring AI's OpenAI model is built on the OpenAI SDK, and the
# spring.ai.retry.* properties do not reach it), where the default of three would send a quota error four times; and
# how long one call may take.
spring.ai.openai.chat.max-completion-tokens=${AI_MAX_COMPLETION_TOKENS:8000}
spring.ai.tools.limits.max-total-tool-calls=${AI_MAX_TOOL_CALLS:20}
spring.ai.tools.limits.max-calls-per-tool-default=${AI_MAX_CALLS_PER_TOOL:10}
spring.ai.openai.chat.max-retries=${AI_MAX_RETRIES:1}
spring.ai.openai.chat.timeout=60s
# Behind a reverse proxy, the client's own address comes in X-Forwarded-For; the budget in app.ai.* counts by it
server.forward-headers-strategy=native

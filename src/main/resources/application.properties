server.port=${PORT:8080}
vaadin.launch-browser=false
# Vaadin scans for routes and components only in the application's own package; its own packages are always scanned
vaadin.allowed-packages=com.vaadin.demo.nordicsupply
logging.level.org.atmosphere=warn

# JPA reads the tables the dataset created; Hibernate never creates or alters them (the default for an embedded
# database would be create-drop, which would wipe the loaded data)
spring.jpa.hibernate.ddl-auto=none
# No session per request: a view reads a projection or a service result, never a lazy association
spring.jpa.open-in-view=false

# The model, reached through Spring AI's OpenAI starter. The key comes from the environment; the placeholder keeps the
# application starting without one, and every model turn then fails with a visible error instead of the start-up.
spring.ai.openai.api-key=${OPENAI_API_KEY:missing-key}
# A full-size model: the smaller ones fill a form as well, but often leave out where they read a value, which the
# claim form outlines in the customer's message
spring.ai.openai.chat.model=${AI_MODEL:gpt-5.6-sol}
spring.ai.openai.chat.temperature=0.2
# GPT-5.6 models reason by default, and the chat-completions endpoint allows function tools only with reasoning off
spring.ai.openai.chat.reasoning-effort=none
